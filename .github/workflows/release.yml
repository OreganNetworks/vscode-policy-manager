name: Release

# Every v* tag builds the VSIX, writes manifest.json and publishes both as a GitHub Release marked Latest.
# Latest is the stable release: every installed copy reads releases/latest/download/manifest.json and installs that
# version, so a new release reaches every copy within the hour.  promote.yml moves stable back to an earlier release.
#
# Two jobs: build runs pnpm install, the tests and the package step - third-party code - with a read-only token, and
# publish holds contents: write for the one step that creates the release.  Actions are pinned to commit SHAs, because
# what this workflow builds goes onto every developer machine.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The whole history, so the next step can see whether the tag is on main
          fetch-depth: 0
      # A tag on a commit that isn't on main would still ship to every installed copy within the hour
      - name: Check the tag is on main
        run: |
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::$GITHUB_REF_NAME is not on main"
            exit 1
          fi
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check the tag matches package.json
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: xvfb-run -a pnpm test:integration
      - run: pnpm package
      - name: Write manifest.json
        run: node scripts/write-manifest.mjs "oregan-policy-manager-${GITHUB_REF_NAME#v}.vsix" manifest.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release
          path: |
            oregan-policy-manager-*.vsix
            manifest.json
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release
      - name: Publish the release
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "oregan-policy-manager-${GITHUB_REF_NAME#v}.vsix" manifest.json \
            --title "$GITHUB_REF_NAME" --generate-notes --latest
