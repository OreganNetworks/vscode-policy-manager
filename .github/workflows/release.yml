name: Release

# Every v* tag builds the VSIX, writes manifest.json and publishes both as a GitHub Release marked Latest.
# Latest is the stable release: every installed copy reads releases/latest/download/manifest.json and installs that
# version, so a new release reaches every copy within the hour.  promote.yml moves stable back to an earlier release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The whole history, so the next step can see whether the tag is on main
          fetch-depth: 0
      # A tag on a commit that isn't on main would still ship to every installed copy within the hour
      - name: Check the tag is on main
        run: |
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::$GITHUB_REF_NAME is not on main"
            exit 1
          fi
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check the tag matches package.json
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: xvfb-run -a pnpm test:integration
      - run: pnpm package
      - name: Write manifest.json
        run: node scripts/write-manifest.mjs "oregan-policy-manager-${GITHUB_REF_NAME#v}.vsix" manifest.json
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "oregan-policy-manager-${GITHUB_REF_NAME#v}.vsix" manifest.json \
            --title "$GITHUB_REF_NAME" --generate-notes --latest
